<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Turnos</title>

    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Solicitar un nuevo turno</h1>
                            </div>
							        <form action="" class="formTurno">
										<div class="form-group row">
											<select id="especialidad" class="form-group" class="solicitarDrop" name="especialidad">
												<option value="" disabled selected>Especialidad</option>
												<option value="Medico Clinico">Médico Clínico</option>
												<option value="Pediatria">Pediatría</option>
												<option value="Dermatologia">Dermatología</option>
												<option value="Ginecologia">Ginecología</option>
												<option value="Cardiologia">Cardiología</option>
												<option value="Urologia">Urología</option>
												<option value="Neurologia">Neurología</option>
												<option value="Nutricion">Nutrición</option>
												<option value="Endocrinologia">Endocrinología</option>
												<option value="Otorrinolaringologia">Otorrinolaringología</option>
												<option value="Odontologia">Odontología</option>
												<option value="Oftalmologia">Oftalmología</option>
											</select>
											<select id="profesional" class="form-group" class="solicitarDrop" name="profesional">
												<option value="" disabled selected>Profesional</option>
												<option value="Dr. Ramirez">Dr. Ramirez</option>
												<option value="Dra. Sánchez">Dra. Sánchez</option>
												<option value="Dr. Pérez">Dr. Pérez</option>
												<option value="Dra. Flarinni">Dra. Flarinni</option>
											</select>
											<select id="dia" class="form-group" class="solicitarDrop" name="dia">
												<option disabled selected>Elegir Día</option>
												<option value="2025-02-17">17/02/2025</option>
												<option value="2025-02-18">18/02/2025</option>
												<option value="2025-02-19">19/02/2025</option>
												<option value="2025-02-20">20/02/2025</option>
												<option value="2025-02-21">21/02/2025</option>
												<option value="2025-02-22">22/02/2025</option>
											</select>
											<select id="hora" class="form-group" class="solicitarDrop" name="hora">
												<option value="" disabled selected>Elegir Horario</option>
												<option value="8:00:00">8:00</option>
												<option value="9:00:00">9:00</option>
												<option value="10:00:00">10:00</option>
												<option value="11:00:00">11:00</option>
												<option value="12:00:00">12:00</option>
												<option value="13:00:00">13:00</option>
											</select>                        
										</div>
									<a href="#"onclick="solicitarTurno()" href="#" class="btn btn-primary btn-user btn-block">Confirmar</a>
							     </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="misturnos.html">Revisar mis turnos anteriores</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
	<script src="js/sb-admin-2.min.js"></script>
	<script src="js/solicitar.js"></script>
</body>

</html>
